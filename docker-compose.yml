services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-extended-swarm
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    volumes:
    - radarr-extended-swarm_config:/config
    - /media/Multimedia/Movies:/movies
    - /media/Multimedia/Incoming:/downloads
    - radarr-extended-swarm_custom-services:/custom-services.d
    - radarr-extended-swarm_custom-cont-init:/custom-cont-init.d
    ports:
    - target: 7878
      published: 7878
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.hostname==ore-dock-110-6
      restart_policy:
        condition: any
volumes:
  radarr-extended-swarm_config:
    name: radarr-extended-swarm_config
  radarr-extended-swarm_custom-services:
    name: radarr-extended-swarm_custom-services
  radarr-extended-swarm_custom-cont-init:
    name: radarr-extended-swarm_custom-cont-init
