---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-extended-swarm
    environment:
      - PUID=1000
      - PGID=33
      - TZ=America/Chicago
    volumes:
      - config:/config
      - /media/Multimedia/Movies:/movies 
      - /media/Multimedia/Incoming/:/downloads
      - custom-services.d:/custom-services.d
      - custom-cont-init.d:/custom-cont-init.d
    ports:
      - target: 7878
        published: 7878
        protocol: tcp
        mode: host        
    deploy:
      placement:
        constraints:
          - node.labels.deployment.target.radarr == true
      restart_policy:
        condition: any
volumes:
  config:
  custom-services.d:
  custom-cont-init.d:
  